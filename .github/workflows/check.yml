name: check

# Chequeo de sitios cada 15 minutos. Commitea solo data/; ese commit no dispara
# pages.yml (filtro por paths) y mantiene vivo el cron: GitHub apaga los
# schedules de repos sin actividad en 60 días.
on:
  schedule:
    # Minutos desfasados: GitHub atrasa o salta los schedules en minutos
    # redondos (:00/:15/:30/:45) por carga. El 2026-10-20 corrió 1 vez en 6 h.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mandar un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Chequear sitios
        run: python3 check.py ${{ inputs.prueba && '--prueba-telegram' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar datos
        run: |
          git config user.name "epicflow-status"
          git config user.email "epicflow-status@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
