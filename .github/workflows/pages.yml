name: pages

# Publica site/ en GitHub Pages solo cuando cambia el código o la lista de
# sitios. Los datos los leen las páginas en vivo desde data/ (raw), así que
# los commits de check.yml no redespliegan.
on:
  push:
    branches: [main]
    paths: ["build.py", "sites.json", "plantilla/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
